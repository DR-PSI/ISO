<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Management — MEA 115/24kV · ISO 55001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F4;
  --surface:#FFFFFF;
  --surface-2:#F2EEE6;
  --border:#E4DFD3;
  --border-strong:#D6CFC0;
  --ink:#211D28;
  --ink-muted:#726B78;
  --ink-faint:#9A93A0;
  --accent:#5B2C6F;
  --accent-ink:#4A2360;
  --accent-soft:#F1E6F7;
  --accent-soft-border:#DFC9EC;
  --amber:#A9761F;
  --amber-soft:#FBF1DE;
  --risk-high:#A93A3A;
  --risk-high-bg:#FBEAEA;
  --risk-medium:#A9761F;
  --risk-medium-bg:#FBF1DE;
  --risk-low:#3E7C52;
  --risk-low-bg:#E8F4EB;
  --shadow: 0 1px 2px rgba(33,29,40,.04), 0 6px 20px -8px rgba(33,29,40,.10);
  --radius: 10px;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#17151D;
    --surface:#1F1B27;
    --surface-2:#262130;
    --border:#332C3F;
    --border-strong:#403751;
    --ink:#F1EEF6;
    --ink-muted:#AAA2B6;
    --ink-faint:#7E7690;
    --accent:#B084D0;
    --accent-ink:#D6B8EC;
    --accent-soft:#2E2440;
    --accent-soft-border:#4A3A5F;
    --amber:#D9A64A;
    --amber-soft:#332A18;
    --risk-high:#E28A8A;
    --risk-high-bg:#3A2323;
    --risk-medium:#D9A64A;
    --risk-medium-bg:#332A18;
    --risk-low:#7FC195;
    --risk-low-bg:#1E3226;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:#17151D;
  --surface:#1F1B27;
  --surface-2:#262130;
  --border:#332C3F;
  --border-strong:#403751;
  --ink:#F1EEF6;
  --ink-muted:#AAA2B6;
  --ink-faint:#7E7690;
  --accent:#B084D0;
  --accent-ink:#D6B8EC;
  --accent-soft:#2E2440;
  --accent-soft-border:#4A3A5F;
  --amber:#D9A64A;
  --amber-soft:#332A18;
  --risk-high:#E28A8A;
  --risk-high-bg:#3A2323;
  --risk-medium:#D9A64A;
  --risk-medium-bg:#332A18;
  --risk-low:#7FC195;
  --risk-low-bg:#1E3226;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -10px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans','IBM Plex Sans Thai',sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- layout ---------- */
#shell{
  display:flex;
  min-height:100%;
}
.sidebar{
  width:252px;
  flex:none;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:22px 14px calc(18px + env(safe-area-inset-bottom, 0px));
  position:sticky;
  top:0;
  height:100vh;
  height:100dvh;
}
.brand{
  padding:4px 10px 20px;
  border-bottom:1px solid var(--border);
  margin-bottom:14px;
}
.brand-mark{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:10px;
}
.brand-dot{
  width:9px;height:9px;border-radius:2px;
  background:var(--accent);
  transform:rotate(45deg);
  flex:none;
}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-0.01em}
.brand-meta{font-size:11.5px;color:var(--ink-muted)}
.brand-meta b{color:var(--ink);font-weight:600}

nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border-radius:7px;
  font-size:13px;
  font-weight:500;
  color:var(--ink-muted);
  cursor:pointer;
  border:none;
  background:none;
  text-align:left;
  width:100%;
  position:relative;
  transition:background-color .12s ease, color .12s ease;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item svg{flex:none;opacity:.75}
.nav-item.active{
  background:var(--accent-soft);
  color:var(--accent-ink);
  font-weight:600;
}
.nav-item.active svg{opacity:1}
.nav-item.active::before{
  content:"";
  position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
  background:var(--accent);border-radius:0 3px 3px 0;
}

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--ink-faint);
  line-height:1.6;
}
.sidebar-foot .sys{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
  font-size:11.5px;color:var(--ink-muted);
}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--risk-low);flex:none;
  box-shadow:0 0 0 3px var(--risk-low-bg);}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
header.topbar{
  padding:18px 28px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  position:sticky;
  top:0;
  z-index:5;
}
.page-title{font-size:18px;font-weight:600;letter-spacing:-0.01em}
.page-subtitle{font-size:12.5px;color:var(--ink-muted);margin-top:3px}
.status-chip{
  font-size:11px;
  padding:5px 10px 5px 8px;
  border-radius:100px;
  background:var(--amber-soft);
  color:var(--amber);
  font-weight:600;
  white-space:nowrap;
  display:flex;align-items:center;gap:6px;
  flex:none;
  border:1px solid color-mix(in srgb, var(--amber) 30%, transparent);
}
.status-chip .dot{width:5px;height:5px;border-radius:50%;background:var(--amber)}

.content{
  flex:1;
  overflow:auto;
  padding:26px 28px 60px;
}
.screen{
  animation: rise .22s ease both;
}
@media (prefers-reduced-motion: reduce){ .screen{animation:none} }
@keyframes rise{ from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none} }

/* ---------- primitives ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.stack{display:flex;flex-direction:column;gap:20px}
.grid-kpi{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px}
.kpi{padding:18px 18px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.kpi .label{font-size:12px;color:var(--ink-muted)}
.kpi .value{font-size:26px;font-weight:700;letter-spacing:-0.01em}
.kpi.hero{
  background:linear-gradient(155deg, var(--accent-soft), var(--surface) 70%);
  border-color:var(--accent-soft-border);
}
.kpi.hero .value{color:var(--risk-high);font-size:32px}
.kpi.hero .sub{font-size:11.5px;color:var(--ink-muted)}
.section-title{font-size:13.5px;font-weight:600}
.section-sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;
}
.badge .swatch{width:6px;height:6px;border-radius:50%}

.chip{
  padding:6px 13px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;
  background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--border);
  transition:.12s ease;
}
.chip:hover{border-color:var(--border-strong)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

table.data{width:100%;border-collapse:collapse;font-size:12.8px}
table.data thead th{
  text-align:left;padding:9px 14px;font-size:10.5px;letter-spacing:.02em;
  color:var(--ink-muted);font-weight:600;background:var(--surface-2);
  border-bottom:1px solid var(--border);
}
table.data thead th.num{text-align:center}
table.data tbody td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top}
table.data tbody td.num{text-align:center}
table.data tbody tr{transition:background-color .1s ease}
table.data tbody tr:hover{background:var(--surface-2)}
.link-btn{
  font-size:12px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;
}
.link-btn:hover{text-decoration:underline}

.note{
  font-size:12px;color:var(--ink-muted);background:var(--accent-soft);
  border:1px solid var(--accent-soft-border);border-radius:8px;padding:11px 15px;
}

/* dashboard chart */
.chart-wrap{padding:20px}
.chart-svg{width:100%;height:180px;display:block}
.chart-legend{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--ink-muted)}

/* register/assessment layout */
.two-col{display:grid;grid-template-columns:230px 1fr;gap:16px}
.asset-list{display:flex;flex-direction:column;gap:3px}
.asset-list-item{
  padding:9px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;
}
.asset-list-item:hover{background:var(--surface-2)}
.asset-list-item.active{background:var(--accent-soft);border-color:var(--accent-soft-border)}
.asset-list-item .id{font-size:10.5px;color:var(--ink-faint)}
.asset-list-item .name{font-size:12.3px;font-weight:500;margin-top:1px}
.asset-list-item.active .id{color:var(--accent-ink)}
.asset-list-item.active .name{color:var(--accent-ink)}

.detail-head{padding:20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.detail-head .name{font-size:16px;font-weight:600}
.detail-head .meta{font-size:12px;color:var(--ink-muted);margin-top:2px}
.detail-head .condition{font-size:13px;margin-top:12px;max-width:46ch}
.detail-head .pm{font-size:11.8px;color:var(--ink-muted);margin-top:10px}
.detail-head .score-block{text-align:right;flex:none}
.detail-head .score-label{font-size:10.5px;color:var(--ink-muted)}
.detail-head .score-value{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:700;line-height:1.1}

/* heatmap */
.matrix-legend{display:flex;gap:16px;margin:10px 0 18px;font-size:11px;color:var(--ink-muted)}
.matrix-legend .item{display:flex;align-items:center;gap:6px}
.matrix-legend .sw{width:11px;height:11px;border-radius:3px}
.matrix{display:flex;gap:10px}
.matrix-axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--ink-muted);align-self:center;flex:none}
.matrix-rows{display:flex;flex-direction:column;gap:6px}
.matrix-num-col{display:flex;flex-direction:column;gap:6px;flex:none}
.matrix-num{width:26px;height:56px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted)}
.matrix-grid{flex:1;display:flex;flex-direction:column;gap:6px}
.matrix-row{display:flex;gap:6px;height:56px}
.matrix-cell{flex:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;transition:transform .12s ease}
.matrix-cell:hover{transform:scale(1.04)}
.matrix-cell .cnt{font-size:17px;font-weight:700}
.matrix-cell .sc{font-size:9px;opacity:.7}
.matrix-x-labels{display:flex;gap:6px}
.matrix-x-labels div{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted)}
.matrix-x-caption{text-align:center;font-size:11px;color:var(--ink-muted);margin-top:4px}

.station-chips{display:flex;gap:10px;flex-wrap:wrap}
.station-chip{
  padding:9px 13px;border-radius:8px;cursor:pointer;min-width:76px;
  border:1px solid; transition:.12s ease;
}
.station-chip:hover{transform:translateY(-1px)}
.station-chip .id{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.8}
.station-chip .sc{font-size:12.5px;font-weight:700;margin-top:2px}

/* compliance */
.compliance-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.doc-block{padding:18px 20px}
.doc-title{font-size:13px;font-weight:600;margin-bottom:8px}
.doc-body{font-size:12.5px;color:var(--ink);line-height:1.65}
.log-row{padding:9px 0;border-top:1px solid var(--border)}
.log-row:first-child{border-top:none}
.log-row .k{font-size:12.5px;font-weight:600}
.log-row .v{font-size:11.5px;color:var(--ink-muted);margin-top:2px}

@media (max-width: 880px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .18s ease;z-index:30;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .grid-kpi{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
  .compliance-grid{grid-template-columns:1fr}
  #menu-btn{display:inline-flex !important}
  header.topbar{padding-left:16px}
}
#menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;flex:none;margin-right:10px}
.header-left{display:flex;align-items:flex-start}
.scrim{display:none}
.scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25}
</style>
</head>
<body>
<div id="shell">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span class="brand-name">Risk Management</span>
      </div>
      <div class="brand-meta"><b>การไฟฟ้านครหลวง</b> · 115/24kV · ISO 55001</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sys"><span class="pulse"></span> Maximo 7.6 · PM sync active</div>
      Extension module for<br><span class="mono" style="color:var(--accent-ink)">Maximo 7.6</span> asset records
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="header-left">
        <button id="menu-btn" aria-label="Toggle menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4H14M2 8H14M2 12H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div>
          <div class="page-title" id="page-title"></div>
          <div class="page-subtitle" id="page-subtitle"></div>
        </div>
      </div>
      <div class="status-chip"><span class="dot"></span>Prototype · Research funding demo</div>
    </header>
    <div class="content"><div class="screen" id="screen"></div></div>
  </div>
</div>

<script>
/* ============ DATA (source of truth, unchanged from original prototype) ============ */
const RISK_LEVELS = {
  high:{label:'High'}, medium:{label:'Medium'}, low:{label:'Low'}
};
function levelFor(score){ if(score>=15) return 'high'; if(score>=6) return 'medium'; return 'low'; }

const ASSETS = [
 {id:'TR-01',name:'Power Transformer 115/24kV TX1',type:'Transformer',station:'Station A',likelihood:4,consequence:5,condition:'DGA trend rising, insulation aging',pmCode:'PM-EL-1042',lastPM:'2026-06-02',nextPM:'2026-12-02'},
 {id:'TR-02',name:'Power Transformer 115/24kV TX2',type:'Transformer',station:'Station A',likelihood:2,consequence:5,condition:'Good, oil test normal',pmCode:'PM-EL-1043',lastPM:'2026-05-18',nextPM:'2026-11-18'},
 {id:'FD-11',name:'Feeder ABC 412',type:'Feeder',station:'Station A',likelihood:3,consequence:4,condition:'Aging cable joints, 2 faults last year',pmCode:'PM-EL-2011',lastPM:'2026-04-10',nextPM:'2026-10-10'},
 {id:'FD-12',name:'Feeder ABC 413',type:'Feeder',station:'Station A',likelihood:2,consequence:3,condition:'Normal',pmCode:'PM-EL-2012',lastPM:'2026-07-01',nextPM:'2027-01-01'},
 {id:'CB-21',name:'Circuit Breaker 24kV Bay 21',type:'Breaker',station:'Station B',likelihood:4,consequence:4,condition:'SF6 gas pressure below threshold',pmCode:'PM-EL-3021',lastPM:'2026-03-22',nextPM:'2026-09-22'},
 {id:'CB-22',name:'Circuit Breaker 24kV Bay 22',type:'Breaker',station:'Station B',likelihood:2,consequence:4,condition:'Normal',pmCode:'PM-EL-3022',lastPM:'2026-06-15',nextPM:'2026-12-15'},
 {id:'TR-03',name:'Power Transformer 115/24kV TX3',type:'Transformer',station:'Station B',likelihood:3,consequence:5,condition:'Bushing partial discharge detected',pmCode:'PM-EL-1044',lastPM:'2026-05-05',nextPM:'2026-11-05'},
 {id:'FD-31',name:'Feeder XYZ 431',type:'Feeder',station:'Station B',likelihood:1,consequence:3,condition:'Normal',pmCode:'PM-EL-2031',lastPM:'2026-07-20',nextPM:'2027-01-20'}
];

const FMEA = {
 'TR-01':[{mode:'Insulation breakdown (winding)',effect:'Transformer trip, feeder outage',s:5,o:4,d:3},
          {mode:'Bushing flashover',effect:'Fire risk, extended outage',s:5,o:2,d:3}],
 'TR-02':[{mode:'Oil contamination',effect:'Reduced insulation life',s:3,o:2,d:2}],
 'FD-11':[{mode:'Cable joint degradation',effect:'Feeder fault, customer outage',s:4,o:3,d:3}],
 'FD-12':[{mode:'Insulator contamination',effect:'Flashover in rainy season',s:2,o:2,d:2}],
 'CB-21':[{mode:'Loss of SF6 insulation gas',effect:'Breaker fails to interrupt fault',s:5,o:3,d:2},
          {mode:'Contact wear',effect:'Overheating, arc flash',s:4,o:3,d:3}],
 'CB-22':[{mode:'Mechanism lubrication degrade',effect:'Delayed operation',s:3,o:2,d:2}],
 'TR-03':[{mode:'Partial discharge in bushing',effect:'Insulation failure, transformer loss',s:5,o:3,d:3}],
 'FD-31':[{mode:'Conductor corrosion',effect:'Minor voltage drop',s:2,o:1,d:2}]
};
const ACTION_BY_LEVEL = {high:'Increase monitoring frequency, plan corrective work order in Maximo',medium:'Add to next quarterly PM cycle, verify with condition data',low:'Continue standard PM cycle'};
const MAINT = {
  high:{strategy:'Condition-based + predictive monitoring (DGA/PD)',interval:'Monthly',priority:'Urgent'},
  medium:{strategy:'Time-based PM with condition check',interval:'Quarterly',priority:'Scheduled'},
  low:{strategy:'Time-based PM (standard cycle)',interval:'Semi-annual',priority:'Routine'}
};
const POLICY_TEXT = 'การไฟฟ้านครหลวงมุ่งบริหารความเสี่ยงของอุปกรณ์ไฟฟ้าระบบ 115/24kV อย่างเป็นระบบ เพื่อความมั่นคงของระบบจำหน่ายไฟฟ้า ความปลอดภัยของบุคลากร และความคุ้มค่าของการลงทุนบำรุงรักษา สอดคล้องตามมาตรฐาน ISO 55001';
const STAKEHOLDERS = [
  {group:'ผู้บริหารการไฟฟ้านครหลวง', need:'ความมั่นคงของระบบไฟฟ้าและงบลงทุนที่คุ้มค่า'},
  {group:'ทีมบำรุงรักษา (Maintenance)', need:'ข้อมูลความเสี่ยงที่แม่นยำเพื่อวางแผน PM/CM'},
  {group:'ผู้ใช้ไฟฟ้า/ลูกค้า', need:'ความต่อเนื่องของการจ่ายไฟ ลดเหตุไฟดับ'},
  {group:'หน่วยงานกำกับดูแล', need:'การปฏิบัติตามมาตรฐานความปลอดภัยและ ISO 55001'}
];
const RESOURCES = [
  {item:'ทีมวิศวกรความเสี่ยง (Risk Engineer)', detail:'ประเมิน FMEA และทบทวนแผนบำรุงรักษาราย 6 เดือน'},
  {item:'ระบบ Maximo 7.6', detail:'บันทึกและติดตาม Work Order/PM ของอุปกรณ์ไฟฟ้า'},
  {item:'งบบำรุงรักษาตามความเสี่ยง', detail:'จัดสรรตามระดับความเสี่ยง High/Medium/Low'}

const state = { screen:'dashboard', selectedAssetId:'TR-01', filterLevel:'all' };

/* ============ helpers ============ */
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function badge(levelKey){
  const cls = 'r-'+levelKey;
  const label = RISK_LEVELS[levelKey].label;
  return `<span class="badge ${cls}" style="background:var(--risk-${levelKey}-bg);color:var(--risk-${levelKey})"><span class="swatch" style="background:var(--risk-${levelKey})"></span>${label}</span>`;
}
function enrich(){
  return ASSETS.map(a=>{
    const score = a.likelihood*a.consequence;
    const lvl = levelFor(score);
    const maint = MAINT[lvl];
    return {...a, score, levelKey:lvl, levelLabel:RISK_LEVELS[lvl].label, maint};
  });
}

function render(){
  const enriched = enrich();
  const meta = PAGE_META[state.screen];
  document.getElementById('page-title').textContent = meta.title;

  // nav
  const navKeys = ['dashboard','register','assessment','heatmap','maintenance','compliance'];
  document.getElementById('nav').innerHTML = navKeys.map(k=>`
    <button class="nav-item ${state.screen===k?'active':''}" data-nav="${k}">
      ${NAV_ICONS[k]}<span>${PAGE_META[k].title}</span>
    </button>`).join('');

  let html = '';
  if(state.screen==='dashboard') html = renderDashboard(enriched);
  else if(state.screen==='register') html = renderRegister(enriched);
  else if(state.screen==='assessment') html = renderAssessment(enriched);

  else if(state.screen==='maintenance') html = renderMaintenance(enriched);
  else if(state.screen==='compliance') html = renderCompliance();

  const el = document.getElementById('screen');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  el.innerHTML = html;
  bindEvents();
}

function trendChart(values, labels){
  const w=560,h=150,padL=26,padR=10,padT=26,padB=22;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min)||1;
  const stepX = (w-padL-padR)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = padL + i*stepX;
    const y = padT + (h-padT-padB) * (1 - (v-min)/range);
    return [x,y];
  });
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h-padB} L${pts[0][0].toFixed(1)},${h-padB} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>
    <text x="${p[0].toFixed(1)}" y="${p[1]-9}" font-size="10.5" text-anchor="middle" fill="var(--ink-muted)" font-family="IBM Plex Mono, monospace">${values[i]}</text>`).join('');
  const xlabels = labels.map((l,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="var(--ink-muted)">${l}</text>`).join('');
  return `
  <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#areaGrad)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xlabels}
  </svg>`;
}

      </div>
    </div>

    ${stations.map(st=>`
      <div class="card" style="padding:20px">
        <div class="section-title" style="margin-bottom:12px">${st.name}</div>
        <div class="station-chips">
          ${st.items.map(a=>`
            <div class="station-chip" data-select="${a.id}" style="background:var(--risk-${a.levelKey}-bg);color:var(--risk-${a.levelKey});border-color:var(--risk-${a.levelKey})">
              <div class="id mono">${a.id}</div><div class="sc">${a.score}</div>
            </div>`).join('')}
        </div>
      </div>`).join('')}
  </div>`;
}

function renderMaintenance(enriched){
  const sorted = [...enriched].sort((x,y)=>y.score-x.score);
  return `
  <div class="stack" style="gap:16px">
    <div class="note">แผนบำรุงรักษาคำนวณจากระดับความเสี่ยง และซิงก์ Work Order เข้ากับ Maximo 7.6 (concept: MXAPIWO)</div>
    <div class="card" style="overflow:auto">
      <table class="data">
        <thead><tr>
          <th>Equipment</th><th>Risk</th><th>Strategy</th><th>Interval</th><th>Priority</th><th>Maximo WO</th><th>Next Action</th>
        </tr></thead>
        <tbody>
          ${sorted.map(a=>`
            <tr>
              <td>
                <div class="mono" style="font-size:11px;color:var(--ink-muted)">${a.id}</div>
                <div>${esc(a.name)}</div>
              </td>
              <td>${badge(a.levelKey)}</td>
              <td>${a.maint.strategy}</td>
              <td>${a.maint.interval}</td>
              <td>${a.maint.priority}</td>
              <td class="mono" style="color:var(--ink-muted)">${a.pmCode}</td>
              <td class="mono">${a.nextPM}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderCompliance(){
  return `
  <div class="stack" style="gap:16px">
    <div class="note">เนื้อหาทั้งหมดในหน้านี้เป็นข้อมูลตัวอย่าง (sample data) สำหรับสาธิตต้นแบบ ยังไม่ใช่ข้อมูลจริงของหน่วยงาน</div>

    <div class="card doc-block">
      <div class="doc-title">5.2 · นโยบายการบริหารสินทรัพย์ (Asset Management Policy)</div>
      <div class="doc-body">${esc(POLICY_TEXT)}</div>
    </div>

    <div class="compliance-grid">
      <div class="card doc-block">
        <div class="doc-title">4.2 · ผู้มีส่วนได้ส่วนเสียและความต้องการ</div>
        ${STAKEHOLDERS.map(s=>`<div class="log-row"><div class="k">${esc(s.group)}</div><div class="v">${esc(s.need)}</div></div>`).join('')}
      </div>
      <div class="card doc-block">
        <div class="doc-title">7.1 · ทรัพยากรที่จัดสรร</div>
        ${RESOURCES.map(r=>`<div class="log-row"><div class="k">${esc(r.item)}</div><div class="v">${esc(r.detail)}</div></div>`).join('')}
      </div>
    </div>

    <div class="card doc-block">
      <div class="doc-title">8.2 · บันทึกการบริหารการเปลี่ยนแปลง (Management of Change)</div>
      <table class="data">
        <thead><tr><th>วันที่</th><th>การเปลี่ยนแปลง</th><th>สถานะ</th></tr></thead>
        <tbody>
          ${CHANGE_LOG.map(c=>`<tr><td class="mono">${c.date}</td><td>${esc(c.change)}</td><td style="color:var(--risk-low)">${c.status}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="compliance-grid">
      <div class="card doc-block">
        <div class="doc-title">9.2 · การตรวจประเมินภายใน (Internal Audit)</div>
        ${AUDIT_LOG.map(a=>`<div class="log-row"><div class="v mono">${a.date} · ${esc(a.scope)}</div><div class="k" style="font-weight:500;font-size:12.8px;margin-top:2px">${esc(a.finding)} <span style="color:var(--risk-low);font-weight:600">· ${a.status}</span></div></div>`).join('')}
      </div>
      <div class="card doc-block">
        <div class="doc-title">9.3 · การทบทวนโดยฝ่ายบริหาร (Management Review)</div>
        ${REVIEW_LOG.map(r=>`<div class="log-row"><div class="v mono">${r.date}</div><div class="k" style="font-weight:500;font-size:12.8px;margin-top:2px">${esc(r.decision)}</div></div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ============ events ============ */
function bindEvents(){
  document.querySelectorAll('[data-select]').forEach(el=>{
    el.addEventListener('click', ()=> setState({screen:'assessment', selectedAssetId: el.getAttribute('data-select')}));
  });
  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.addEventListener('click', ()=> setState({filterLevel: el.getAttribute('data-filter')}));
  });
}
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('[data-nav]');
  if(btn) setState({screen: btn.getAttribute('data-nav')});
});

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('menu-btn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
});
document.getElementById('scrim').addEventListener('click', closeSidebar);

render();
</script>
</body>
</html>
